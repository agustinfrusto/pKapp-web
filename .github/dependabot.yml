# Dependabot: abre PRs ante dependencias desactualizadas/vulnerables.
# Nota: las ALERTAS y los "security updates" se activan aparte, en
# GitHub → Settings → Code security and analysis (ahí está el valor de seguridad).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Agrupa minor+patch en un solo PR para reducir ruido.
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Core del SDK de Expo: se actualiza junto vía `expo install --fix`
      # al hacer upgrade de SDK, nunca con PRs sueltos (desalinea y rompe el build).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "babel-preset-expo"
      # Módulos nativos que el SDK pinea en `expo/bundledNativeModules.json`:
      # ignorados por completo, no solo en major. Sus minor apuntan al SDK
      # siguiente (reanimated 4.6 pide react-native 0.83-0.87 y estamos en 0.81),
      # así que se mueven con `expo install --fix` al hacer upgrade de SDK.
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      # Resto del ecosistema RN / navegación: dejamos pasar minor/patch (van
      # agrupados), pero bloqueamos los MAJOR (rompen y deben alinear a mano).
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-navigation/*"
        update-types: ["version-update:semver-major"]
