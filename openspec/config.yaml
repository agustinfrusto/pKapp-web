schema: spec-driven

context: |
  ## Qué es pKapp

  App de estudio para alumnos de la Escuela Técnica de Medicina (ESFUNO, Uruguay).
  Banco de preguntas de exámenes reales con quiz, estadísticas y repaso de fallos.
  pKapp es solo web (PWA): no hay versión nativa ni builds para iOS o Android.

  ## Invariantes (no negociables)

  - TODO LOCAL: el progreso del usuario vive en su dispositivo. No hay backend
    propio ni base de datos remota. Nada de lo que el usuario responde, falla o
    agrega sale del navegador.
  - SIN CUENTAS: no hay login, registro ni identidad. El respaldo se mueve a mano
    (exportar/importar archivo desde Ajustes).
  - GRATIS SIEMPRE: sin planes, sin paywall, sin contenido bloqueado. Las
    donaciones (links externos a Mercado Pago) son voluntarias y nunca pueden
    condicionar el acceso a una funcionalidad.

  Dos matices reales, para no contradecirlos sin querer:
  - `src/utils/track.js` manda eventos anónimos de uso a Umami (analítica web).
    Es lo único que sale del dispositivo. No incluye respuestas ni contenido del
    usuario, y degrada a no-op si el script está bloqueado.
  - `src/utils/mercadopago.js` solo guarda links de pago externos. No hay
    integración de pagos en la app.

  ## Stack

  - Expo / React Native corriendo en web, exportado como PWA instalable.
  - React Navigation (native-stack). Sin TypeScript ni linter configurado. No hay
    tests unitarios; sí un arnés e2e de navegación en `tools/e2e` (`npm run e2e`).
  - Estilos con NativeWind 4 (Tailwind 3 vía `className`). Los tokens de diseño viven
    en `src/theme/` (`colores.js`, `fuentes.web.js`, `TemaContext.js`).
  - Capa de datos en `src/db/database.web.js` (localStorage). Las claves se namespacean
    por materia: `pkapp_question_stats:<materiaId>`,
    `pkapp_user_questions:<materiaId>`. Los settings (`pkapp_settings`) son globales
    cross-materia a propósito.
  - Compatibilidad de datos hacia atrás: los usuarios no tienen cuenta ni respaldo
    automático, así que romper el formato de localStorage les borra el progreso.
    Todo cambio de forma necesita su migración, al estilo del flag `pkapp_migrated_v0.10`.
  - Navegadores soportados (decisión del usuario, 2026-10-16): Safari/iOS 15.4+, Chrome/Edge 93+, Firefox 92+ y Samsung Internet 17+. Sin polyfills: el código puede usar todo lo que esas versiones traen (por ejemplo `Object.hasOwn` y `:focus-visible`). Cambiar el piso es una decisión del usuario.

  ## Dominio

  - MATERIA: unidad de nivel superior (hoy `bcyt`, `anatomia`, `neuro`, `cyr`, `dre`, `ryd`).
    Cada una es una carpeta en `src/materias/<id>/` con seis archivos: `metadata.js` (`id`,
    `name`, `shortName`, `description`, `available`), `ilustracion.js`, `config.js`
    (`examSize`, `parciales`), `topics.js`, `questions.js` e `index.js` que compone todo. Se
    registran en `src/materias/index.js`.
  - PARCIAL: subdivisión del año de una materia. Puede ser `null` (solo BCYT y Anatomía
    tienen parciales) y ahí la UI oculta el filtro.
  - TOPIC: tema dentro de una materia. Mapa slug → nombre legible en `topics.js`.
  - SOURCE: origen de una pregunta. `exam` = extraída de un examen real; `generated`
    = generada a partir de apuntes (hoy ningún banco publicado tiene generadas); `user` =
    agregada por el usuario. La distinción debe permanecer visible (chip de origen del quiz):
    nunca presentar una generada como si fuera real. El filtro de fuente de TopicSelect es
    «Todas / Solo mías» y solo aparece con preguntas propias (TOPIC-P6, 2026-10-11).
  - Pregunta: `{ id, source, exam, topic, materia, question, options, correctIndex, explanation }`.
  - Preguntas propias del usuario: se guardan solo en su dispositivo, nunca en el repo.

  ## Contenido de terceros

  Las preguntas se basan en material de estudio de terceros, con derechos de sus
  autores. Se reproducen sin fines comerciales y con fines educativos. Cada
  `questions.js` lleva ese encabezado legal: no lo quites al editar el archivo.
  Ver `LICENSE-CONTENT`.

  ## Convenciones

  - Todo en español: código, comentarios, commits y UI. Los comentarios explican
    el porqué, no el qué, y son escuetos.
  - Commits: Conventional Commits, `tipo(alcance): descripción en minúscula`
    (tipos feat, fix, docs, chore, refactor, test, style). Si el cambio incluye bump,
    la versión va al final entre paréntesis.
  - VERSIÓN: se bumpea en `package.json` Y en `app.json` a la vez, siempre al mismo
    número. `app.json` es la que se muestra en Ajustes vía `expo-constants`.
    Bumpea solo el commit que toca la app que se publica (src, public, scripts, build de
    la raíz, app.json, package.json), con semver estricto desde el último tag, y lleva
    tag `vX.Y.Z`. tools, openspec, .claude y docs no bumpean. Lo hace el Ingeniero (`openspec/commit.md`).
  - No commitear ni pushear sin que el usuario lo pida explícitamente.
  - Trabajo multi-agente: cinco roles (Ingeniero, Diseñador, Programador, Investigador, Analista),
    resumen en `CLAUDE.md` y contrato en `openspec/workers.md`. Solo el Ingeniero commitea y pushea, con orden.
  - Build web: `npm run build:web` (`scripts/gen-conteos.mjs` + expo export +
    `scripts/inject-pwa.js`). `dist/` está gitignoreado.
    `src/materias/conteos.js` es generado y va commiteado: no editarlo a mano.
  - Deploy: Cloudflare Pages conectado al repo. Ver `docs/CLOUDFLARE-MIGRATION.md`.

  ## Estilo del README y documentación pública

  - El tono debe ser honesto, humano y sobrio. No usar lenguaje de producto,
    lanzamientos ni claims grandilocuentes. Evitar palabras como “revolucionario”,
    “premium”, “game changer”, “best”, “increíble” o “drag and drop” salvo que
    realmente describan una funcionalidad concreta.
  - La narrativa debe explicar el origen real del proyecto: nació para ayudar a una
    persona concreta (por ejemplo, la pareja del autor) y luego fue útil para más
    personas. Esa verdad da credibilidad al proyecto y no requiere marketing.
  - La introducción debe ser breve, concreta y humana: problema real, intención,
    contexto y una línea de cómo la app se usa en la práctica.
  - El README debe presentar la app como una herramienta de estudio útil, nunca como
    una “demo” ni un producto presentado en una keynote.
  - La estructura recomendada es: introducción, qué hace, enfoque de construcción
    (Spec Driven Development), características clave, instalación, arquitectura,
    contenido/licencia y notas de uso. Mantener el orden de la historia.
  - En español, con jerga técnica mínima y explicada cuando hace falta. La claridad
    importa más que la sofisticación del tono.
  - Todo cambio de documentación debe preservar esa combinación de sinceridad,
    claridad y rigor técnico.

