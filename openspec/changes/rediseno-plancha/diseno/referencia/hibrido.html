<style>
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
:root{--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
[data-theme=light]{--stage:#dfe2e5;--frame:#9aa2ab;--bg:#f4f5f6;--surface:#ffffff;--ink:#14181d;--ink2:#4a525c;--hair:#b9bfc6;--line:#14181d;
--accent:#0b6e80;--ok:#1f6b3a;--okbg:#e6f1ea;--bad:#a32424;--badbg:#f8e9e9;--fil:#14181d}
[data-theme=dark]{--stage:#050607;--frame:#2b323a;--bg:#0b0d10;--surface:#12161b;--ink:#e6e9ed;--ink2:#98a2ae;--hair:#2b323a;--line:#c9d0d8;
--accent:#5cc3d6;--ok:#7bcb92;--okbg:#10231a;--bad:#f08c8c;--badbg:#2a1414;--fil:#8fb4c9}
body{font-family:var(--sans);background:#8c939b;color:#14181d;-webkit-font-smoothing:antialiased}
.tool{font:12px/1.4 var(--mono);padding:14px 24px;color:#14181d}
.board{background:var(--stage);padding:28px 40px 40px;color:var(--ink)}
.board h2{font:500 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:18px}
.strip6{display:flex;gap:24px;align-items:flex-start}
figure{width:390px;flex:none}
figcaption{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.phone{width:390px;height:860px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;border:1px solid var(--frame)}
body:has(#oscuro:target) #claro,body:has(#oscuro:target) .tool{display:none}
body:has(#claro:target) #oscuro,body:has(#claro:target) .tool{display:none}
.meta{font:11px/1.45 var(--mono);color:var(--ink2);letter-spacing:.05em;text-transform:uppercase}
.meta.r{text-align:right}
.tag{font:11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.tag.pad{padding:16px 20px 8px}
.lb,.lb2{font:10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.top{padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);font:11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.seg span{padding:6px 9px;color:var(--ink)}.seg .on{background:var(--ink);color:var(--bg)}
.btn-o{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 12px;font-size:14px;font-weight:600}
.bar2{display:flex;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
.card{position:relative;border:1px solid var(--line);background:var(--surface);margin:0 20px 12px}
.k{position:absolute;width:9px;height:9px;border:0 solid var(--line)}
.k.ka{left:-4px;top:-4px;border-left-width:2px;border-top-width:2px}.k.kb{right:-4px;top:-4px;border-right-width:2px;border-top-width:2px}
.k.kc{left:-4px;bottom:-4px;border-left-width:2px;border-bottom-width:2px}.k.kd{right:-4px;bottom:-4px;border-right-width:2px;border-bottom-width:2px}
.row{display:flex}
.thumb{width:76px;flex:none;border-right:1px solid var(--hair);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.thumb.big{width:104px}
.info{flex:1;padding:9px 12px}
.id{font:11px/1 var(--mono);color:var(--accent);letter-spacing:.06em}
.nm{font-weight:600;font-size:15.5px;line-height:1.25;margin-top:4px}.nm.lg{font-size:18px;margin-top:6px}
.info .d{font-size:13px;color:var(--ink2);margin-top:6px}
.tb{display:flex;border-top:1px solid var(--hair);font:11px/1 var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.tb span{padding:5px 12px}.tb span+span{border-left:1px solid var(--hair)}.tb b{color:var(--ink);font-weight:500}
/* selector */
.fig{margin-top:6px}
.fig .band{color:var(--fil);height:118px;overflow:hidden;border-bottom:1px solid var(--hair)}
.fig .band svg{display:block;width:100%;height:100%}
.cont{stroke:var(--accent)}
.fig .ruler{display:block;margin:0 0 0 0;color:var(--ink2);width:100%}
.plate{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--hair);padding:10px 14px}
.word{font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1}
.list{padding-top:6px}
.list .card{margin-bottom:10px}
.list .thumb{width:68px}
/* home */
.fig2{margin-top:6px}
.acts{padding:0 20px}
.act{display:flex;gap:14px;align-items:center;border:1px solid var(--hair);background:var(--surface);padding:14px 14px;margin-bottom:10px}
.act.pri{border:2px solid var(--line)}
.act .ico{width:40px;height:40px;flex:none;border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.act .tx{flex:1}.act .t{font-weight:600;font-size:16px}.act .d{font-size:13.5px;color:var(--ink2);line-height:1.4;margin-top:3px}
.chev{color:var(--ink2);display:flex}
/* tema */
.panel{margin:16px 20px 12px;border:1px solid var(--line);background:var(--surface);padding:14px}
.panel .lb{margin-bottom:8px}.hr{height:1px;background:var(--hair);margin:14px 0}
.segs{display:flex;flex-wrap:wrap;gap:0}
.segs span{border:1px solid var(--hair);margin:0 -1px -1px 0;padding:9px 12px;font-size:14px;color:var(--ink)}
.segs span.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;position:relative}
.timer{display:flex;align-items:center;gap:18px}.timer .v{font-weight:600;font-size:15px}
.sq{width:36px;height:36px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.sq.off{border-color:var(--hair);color:var(--ink2)}
.mix{margin:0 20px;border:2px solid var(--accent);background:var(--surface);padding:12px 14px}
.mix .lb2{color:var(--accent)}.mix .t{font-weight:600;font-size:16px;margin-top:6px}.mix .d{font-size:13px;color:var(--ink2);margin-top:3px}
.tl{margin:0 20px;border-top:1px solid var(--line)}
.trow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.trow .n{font:12px var(--mono);color:var(--ink2);width:22px}.trow .t{flex:1;font-weight:600;font-size:15.5px}
.trow .c{font:12px var(--mono);color:var(--ink2)}
/* quiz */
.qbar{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.ticks{flex:1;display:flex;gap:2px}.ticks i{flex:1;height:10px;border:1px solid var(--hair);display:block}.ticks i.on{background:var(--ink);border-color:var(--ink)}
.cnt{font:12px var(--mono)}
.q{padding:18px 20px 6px}.chips{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}
.chip{display:inline-block;font:11px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);padding:2px 7px}
.qbox{border:1px solid var(--line);background:var(--surface);padding:14px 14px 16px}
.qbox p{font-size:19px;line-height:1.35;margin-top:6px;font-weight:600}
.opts{padding:12px 20px 0}
.opt{display:flex;border:1px solid var(--hair);background:var(--surface);margin-bottom:10px}
.opt .L{width:44px;flex:none;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--hair);font:500 14px var(--mono)}
.opt .T{flex:1;padding:11px 12px;font-size:15px;line-height:1.35}
.opt .S{display:flex;gap:6px;align-items:center;font:10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;margin-top:5px}
.opt.ok{border:2px solid var(--ok);background:var(--okbg)}.opt.ok .L{background:var(--ok);color:var(--bg);border-right:2px solid var(--ok)}.opt.ok .S{color:var(--ok)}
.opt.bad{border:2px solid var(--bad);background:var(--badbg)}.opt.bad .L{background:var(--bad);color:var(--bg);border-right:2px solid var(--bad)}.opt.bad .S{color:var(--bad)}
.note{margin:6px 20px 0;border-left:3px solid var(--accent);background:var(--surface);border-top:1px solid var(--hair);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:10px 14px 12px}
.note .lb{color:var(--accent)}.note p{font-size:14px;line-height:1.5;margin-top:5px}
.cta{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 18px;background:var(--bg);border-top:1px solid var(--line)}
.btn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--bg);border:0;padding:14px 16px;font:600 15px var(--sans)}
/* resultados */
.res{margin-top:16px;padding:18px 18px 18px}
.big{font:500 72px/1 var(--mono);letter-spacing:-.03em;color:var(--ok);margin-top:12px}.big.am{color:var(--ink);font-size:60px}
.sub{font-size:17px;margin-top:10px}.msg{font-size:14.5px;color:var(--ink2);margin-top:6px}
.strip{display:flex;gap:2px;align-items:flex-end;height:22px;margin:18px 0 8px}
.strip i{flex:1;display:block}.strip i.c{height:22px;background:var(--ok)}.strip i.i{height:11px;background:var(--bad)}
.leg{display:flex;gap:18px;font:10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:14px}
.leg i{display:inline-block;width:9px;margin-right:5px}.leg i.c{height:9px;background:var(--ok)}.leg i.i{height:5px;background:var(--bad)}
.trio{display:flex;padding:0}.cell{flex:1;padding:12px 0;text-align:center}.cell+.cell{border-left:1px solid var(--hair)}
.cell b{display:block;font:500 26px/1 var(--mono);color:var(--ink)}.cell b.g{color:var(--ok)}.cell b.r{color:var(--bad)}
.cell span{display:block;font:10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.btns{padding:6px 20px 0}.b{padding:14px 16px;text-align:center;font-weight:600;font-size:15px;margin-bottom:10px;border:1px solid var(--line)}
.b.o{border:1px solid var(--accent);color:var(--accent);background:var(--surface)}.b.s{background:var(--ink);color:var(--bg);border-color:var(--ink)}.b.n{background:var(--surface);color:var(--ink)}
/* stats */
.gl{margin-top:16px;padding:16px 18px;text-align:center}
.sub2{font-size:14px;color:var(--ink2);margin-top:8px}
.srows{padding:0 20px}
.srow{border-top:1px solid var(--hair);padding:11px 0 10px}
.srow .h{display:flex;justify-content:space-between;align-items:baseline}.srow .t{font-weight:600;font-size:15.5px}
.srow .p{font:500 16px var(--mono);color:var(--ink)}.srow .p.g{color:var(--ok)}.srow .p.r{color:var(--bad)}
.bar{position:relative;height:8px;border:1px solid var(--hair);background:var(--surface);margin:7px 0 6px}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);display:block}.bar b.g{background:var(--ok)}.bar b.r{background:var(--bad)}
.bar u{position:absolute;left:80%;top:-4px;height:14px;width:0;border-left:1px solid var(--line);text-decoration:none}
.srow .d{font-size:12.5px;color:var(--ink2)}
</style>
